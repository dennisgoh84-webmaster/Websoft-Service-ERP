# The Websoft Service ERP stack: Postgres, the PHP/Laravel backend, and
# nginx serving the React frontend and proxying /api/* to it.
#
#     docker compose up -d --build
#
# Run from the repository root, where .env lives (deploy/install.sh
# writes it). deploy/install.sh and deploy/upgrade.sh wrap this file;
# see deploy/README.md.
#
# This was deploy/docker-compose.php.yml until 2026-09-15, when the
# Python backend was retired and this became the only stack. The
# project name and volume names below are unchanged from that file ON
# PURPOSE: an existing server's database and uploads live in
# websoft-erp_db_data / websoft-erp_uploads_data, and an `up` from this
# file adopts them rather than starting a second, empty set.
#
# `backend-php` keeps the network alias `backend`, which is what the
# frontend's nginx proxies to (frontend/nginx.conf). The PHP image
# serves HTTP on 8000 for the same reason.
name: websoft-erp

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: websoft_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_DB: websoft_service_erp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websoft_app -d websoft_service_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrations run as a one-shot service, separately from the app, so a
  # rolling restart never re-runs them. Laravel wraps each migration in
  # a transaction, so a failure leaves nothing half-applied.
  migrate-php:
    build: ./backend-php
    entrypoint: []
    command: ["php", "artisan", "migrate", "--force"]
    environment: &backend_php_env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?generate one with deploy/install.sh}
      APP_TIMEZONE: Asia/Singapore
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: websoft_service_erp
      DB_USERNAME: websoft_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      JWT_SECRET: ${JWT_SECRET_KEY:?set a real random secret in .env}
      UPLOADS_DIR: /var/www/html/storage/app/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Web Master Consultancy}
      UPGRADE_AGENT_TOKEN: ${UPGRADE_AGENT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend-php:
    build: ./backend-php
    restart: unless-stopped
    environment: *backend_php_env
    volumes:
      - uploads_data:/var/www/html/storage/app/uploads
    networks:
      default:
        aliases:
          - backend
    depends_on:
      db:
        condition: service_healthy
      migrate-php:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      - backend-php

volumes:
  db_data:
  uploads_data:
