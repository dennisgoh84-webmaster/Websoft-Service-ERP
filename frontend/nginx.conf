server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: any path that isn't a real static file falls back to
    # index.html so client-side routes (e.g. /company-individuals) work
    # on a hard refresh, not just via in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same origin as the frontend, so the backend needs no CORS
    # configuration at all. `backend` is the network alias the
    # backend-php service carries in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mobile web app: allow large photo/video uploads (no limit
        # confirmed with Dennis, 2026-09-12). Default nginx limit is 1MB
        # which is too small for photos, let alone videos.
        client_max_body_size 500m;
    }
}
