; Overrides the base php:8.4-fpm image's stock pool (which ships with
; pm.start_servers = 2, pm.max_children = 5) -- with only 2 workers
; started up front, two people running a report at once occupy both,
; and a third report request (or export/PDF conversion, which holds a
; worker for the length of the whole query + LibreOffice/spreadsheet
; generation) queues behind them until FPM notices demand and spins up
; another child. That queuing is what "reports only allow 2 concurrent
; sessions" was -- an FPM pool sizing default, not application code.
;
; Values are for the single small VPS this runs on (Approved
; Architecture Decisions #4) -- room to raise later if a bigger box is
; provisioned, not a tuned-for-load figure.
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
; Recycle workers periodically -- cheap insurance against a slow memory
; leak in a long-running request (LibreOffice conversion, PhpSpreadsheet
; export) accumulating across thousands of requests on one worker.
pm.max_requests = 500
