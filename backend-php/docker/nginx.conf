# nginx in front of php-fpm inside the backend-php container, so the
# container speaks plain HTTP on :8000 and the frontend's nginx keeps a
# single proxy_pass. See the Dockerfile for why the two processes live
# in one image.
server {
    listen 8000;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Mobile web app: photo and video uploads (no size limit confirmed
    # with Dennis, 2026-09-12). Kept in step with frontend/nginx.conf,
    # which sets the same limit on the hop in front of this one -- the
    # smaller of the two wins, so they must not drift apart.
    client_max_body_size 500m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # LibreOffice converting a .docx to PDF is slow on a cold start;
        # the default 60s can time out the first "Email X" of the day.
        fastcgi_read_timeout 180;
    }

    location ~ /\.ht {
        deny all;
    }
}
