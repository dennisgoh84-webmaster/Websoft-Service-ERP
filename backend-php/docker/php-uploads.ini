; PHP's own defaults (upload_max_filesize=2M, post_max_size=8M) are far
; too small for the ad banner's video upload
; (App\Http\Controllers\Api\AnnouncementController::uploadVideo(), capped
; at 100MB in application code) -- silently truncated/rejected uploads
; otherwise. Kept comfortably under nginx's own 500m client_max_body_size
; (docker/nginx.conf) so nginx is never the tighter limit.
upload_max_filesize = 150M
post_max_size = 150M
