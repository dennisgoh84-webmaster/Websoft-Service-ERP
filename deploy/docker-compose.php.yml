# The PHP/Laravel stack, self-contained.
#
# Used with -f ON ITS OWN, not layered over ../docker-compose.yml:
#
#     docker compose --env-file .env -f deploy/docker-compose.php.yml up -d --build
#
# Self-contained on purpose. Layering an override would mean relying on
# Compose's merge rules to switch `frontend`'s depends_on and disable
# the Python services, and a half-applied merge there would quietly
# start the WRONG backend. A whole file cannot half-apply.
#
# The cost is that `db` and `frontend` are declared in two places. If
# you change either here, change it in ../docker-compose.yml too.
#
# NOTE `backend-php` takes the network alias `backend`, so the
# frontend's nginx keeps its single `proxy_pass http://backend:8000`
# with no edit. The PHP image serves HTTP on 8000 for this reason.

# Pinned so the volume names are stable and obvious
# (websoft-erp_db_data), rather than taken from whatever directory this
# file happens to sit in. It also keeps this stack's data separate from
# the Python stack in ../docker-compose.yml, which is what you want --
# they are two different backends, not two copies of one.
name: websoft-erp

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: websoft_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_DB: websoft_service_erp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websoft_app -d websoft_service_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate-php:
    build: ../backend-php
    entrypoint: []
    command: ["php", "artisan", "migrate", "--force"]
    environment: &backend_php_env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?generate one with deploy/install.sh}
      APP_TIMEZONE: Asia/Singapore
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: websoft_service_erp
      DB_USERNAME: websoft_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      JWT_SECRET: ${JWT_SECRET_KEY:?set a real random secret in .env}
      UPLOADS_DIR: /var/www/html/storage/app/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Web Master Consultancy}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend-php:
    build: ../backend-php
    restart: unless-stopped
    environment: *backend_php_env
    volumes:
      - uploads_data:/var/www/html/storage/app/uploads
    networks:
      default:
        aliases:
          - backend
    depends_on:
      db:
        condition: service_healthy
      migrate-php:
        condition: service_completed_successfully

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend-php

volumes:
  db_data:
  uploads_data:
